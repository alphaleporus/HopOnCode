<svg viewBox="0 0 1280 700" width="1280" height="700" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>How a fix is chosen</title>
  <desc>For the TRK-402 breakdown every option gets an expected cost: wait 37,985 rupees, QuickFreight 15,567, RapidLogistics 15,760, ExpressHaul 21,799. The lowest, QuickFreight, passes three checks (saves at least 2,000 rupees: 22,418; at least 5 percent of waiting: 59 percent; confidence at least 0.6: 0.85) and is recommended. If a check fails it is shown as an option; if waiting is cheapest the truck is monitored.</desc>
  <style>
    text { font-family: "IBM Plex Mono", Consolas, "DejaVu Sans Mono", monospace; }
    .num { font-family: Archivo, Inter, "Segoe UI", Arial, sans-serif; }
  </style>
  <defs>
    <pattern id="fx-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2F4FE0" stroke-opacity=".07"/>
    </pattern>
    <marker id="fx-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#2F4FE0"/>
    </marker>
    <marker id="fx-arrow-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#8A90A2"/>
    </marker>
  </defs>

  <rect width="1280" height="700" fill="#FBFAF7"/>
  <rect width="1280" height="700" fill="url(#fx-grid)"/>
  <rect x=".5" y=".5" width="1279" height="699" fill="none" stroke="#D9DBE3"/>
  <g fill="none" stroke="#14171F" stroke-opacity=".45" stroke-width="1.5">
    <path d="M16 36V16H36"/><path d="M1244 16H1264V36"/><path d="M16 664V684H36"/><path d="M1264 664V684H1244"/>
  </g>

  <text x="48" y="52" font-size="14" font-weight="700" fill="#14171F" letter-spacing="3">HOW A FIX IS CHOSEN</text>
  <text x="1232" y="52" text-anchor="end" font-size="12" fill="#2F4FE0" letter-spacing="2">FF / 05</text>
  <line x1="48" y1="68" x2="1232" y2="68" stroke="#14171F" stroke-opacity=".15"/>

  <!-- incident -->
  <rect x="48" y="262" width="250" height="96" fill="#F6F5F1" stroke="#14171F" stroke-width="1.2"/>
  <text x="64" y="288" font-size="10" fill="#59636E" letter-spacing="2">INCIDENT</text>
  <text x="64" y="314" font-size="15" font-weight="700" fill="#14171F" letter-spacing="1.5">TRUCK STOPPED</text>
  <text x="64" y="338" font-size="11" fill="#59636E">TRK-402 · breakdown ≈ 3 h</text>

  <!-- options -->
  <text x="340" y="104" font-size="11" font-weight="700" fill="#2F4FE0" letter-spacing="2">EXPECTED COST OF EVERY OPTION</text>
  <rect x="340" y="112" width="460" height="428" fill="#F3F5FC" stroke="#2F4FE0" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="364" y="136" width="412" height="76" fill="#FFFFFF" stroke="#E8962B" stroke-width="1.5"/>
  <rect x="364" y="136" width="6" height="76" fill="#E8962B"/>
  <rect x="364" y="230" width="412" height="76" fill="#14171F" stroke="#1F9461" stroke-width="2"/>
  <rect x="364" y="230" width="6" height="76" fill="#1F9461"/>
  <rect x="364" y="324" width="412" height="76" fill="#F6F5F1" stroke="#14171F" stroke-width="1.2"/>
  <rect x="364" y="418" width="412" height="76" fill="#F6F5F1" stroke="#14171F" stroke-width="1.2"/>
  <rect x="690" y="236" width="66" height="18" fill="#1F9461"/>
  <text x="723" y="249" text-anchor="middle" font-size="10" fill="#FFFFFF" letter-spacing="1.5">LOWEST</text>
  <g font-size="14" font-weight="700" letter-spacing="1.2">
    <text x="388" y="166" fill="#14171F">WAIT FOR REPAIR</text><text x="388" y="260" fill="#F6F5F1">QUICKFREIGHT</text>
    <text x="388" y="354" fill="#14171F">RAPIDLOGISTICS</text><text x="388" y="448" fill="#14171F">EXPRESSHAUL</text>
  </g>
  <g font-size="11">
    <text x="388" y="190" fill="#59636E">₹0 quote · 1.8 h late</text>
    <text x="388" y="284" fill="#AEB6CF">₹12,000 quote · 95% reliable</text>
    <text x="388" y="378" fill="#59636E">₹15,000 quote · 98% reliable</text>
    <text x="388" y="472" fill="#59636E">₹18,000 quote · 90% reliable</text>
  </g>
  <g font-size="26" font-weight="700" text-anchor="end">
    <text class="num" x="756" y="190" fill="#B86E12">₹37,985</text>
    <text class="num" x="756" y="290" fill="#F6F5F1">₹15,567</text>
    <text class="num" x="756" y="378" fill="#14171F">₹15,760</text>
    <text class="num" x="756" y="472" fill="#14171F">₹21,799</text>
  </g>

  <!-- flows -->
  <g fill="none" stroke="#2F4FE0" stroke-width="1.6"><path d="M298 310H352"/><path d="M352 174V456"/></g>
  <g fill="none" stroke="#2F4FE0" stroke-width="1.6" marker-end="url(#fx-arrow)">
    <path d="M352 174H360"/><path d="M352 268H360"/><path d="M352 362H360"/><path d="M352 456H360"/>
    <path d="M776 268H818V172H842"/>
    <path d="M963 204V232"/><path d="M963 300V328"/><path d="M963 396V424"/>
  </g>

  <!-- checks -->
  <g fill="#14171F" stroke="#2F4FE0" stroke-width="1.5">
    <polygon points="862,140 1064,140 1080,172 1064,204 862,204 846,172"/>
    <polygon points="862,236 1064,236 1080,268 1064,300 862,300 846,268"/>
    <polygon points="862,332 1064,332 1080,364 1064,396 862,396 846,364"/>
  </g>
  <g font-size="13" font-weight="700" fill="#F6F5F1" letter-spacing="1">
    <text x="872" y="167">SAVES ≥ ₹2,000</text><text x="872" y="263">≥ 5% OF WAITING</text><text x="872" y="359">CONFIDENCE ≥ 0.6</text>
  </g>
  <g font-size="12" font-weight="700" fill="#3DBE84" letter-spacing="1">
    <text x="872" y="189">PASS · ₹22,418</text><text x="872" y="285">PASS · 59%</text><text x="872" y="381">PASS · 0.85</text>
  </g>
  <rect x="846" y="428" width="234" height="72" fill="#1F9461"/>
  <text x="864" y="458" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">RECOMMEND</text>
  <text x="864" y="482" font-size="12" fill="#FFFFFF" fill-opacity=".85">one-click approve</text>

  <!-- side exits -->
  <g fill="none" stroke="#8A90A2" stroke-width="1.4" stroke-dasharray="4 4">
    <path d="M1080 172H1100"/><path d="M1080 268H1100"/><path d="M1080 364H1100"/><path d="M1100 172V464"/>
  </g>
  <path d="M1100 464H1112" fill="none" stroke="#8A90A2" stroke-width="1.4" marker-end="url(#fx-arrow-grey)"/>
  <text x="1114" y="320" transform="rotate(-90 1114 320)" font-size="9" fill="#59636E" letter-spacing="1.5">ANY CHECK FAILS</text>
  <rect x="1116" y="428" width="116" height="72" fill="#FFFFFF" stroke="#8A90A2" stroke-dasharray="4 4"/>
  <text x="1130" y="458" font-size="13" font-weight="700" fill="#59636E" letter-spacing="1">OPTION</text>
  <text x="1130" y="480" font-size="10" fill="#59636E">shown, not pushed</text>

  <path d="M570 540V578" fill="none" stroke="#8A90A2" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#fx-arrow-grey)"/>
  <rect x="420" y="582" width="300" height="60" fill="#FFFFFF" stroke="#8A90A2" stroke-dasharray="4 4"/>
  <text x="570" y="608" text-anchor="middle" font-size="13" font-weight="700" fill="#59636E" letter-spacing="1">MONITOR</text>
  <text x="570" y="628" text-anchor="middle" font-size="11" fill="#59636E">if waiting is already cheapest</text>

  <text x="48" y="676" font-size="12" fill="#14171F" fill-opacity=".75" letter-spacing=".5">EXPECTED COST = QUOTE + r × PENALTY IF IT DELIVERS + (1 − r) × COST OF WAITING ANYWAY · r = reliability</text>
</svg>
