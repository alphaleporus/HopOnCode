<svg viewBox="0 0 1280 320" width="1280" height="320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>FleetFusion</title>
  <desc>Real-time delay decisions for road freight. Two routes, plan and reality, merge into a stop.</desc>
  <style>
    .mono { font-family: "IBM Plex Mono", Consolas, "DejaVu Sans Mono", monospace; }
    .sans { font-family: Archivo, Inter, "Segoe UI", Arial, sans-serif; }
  </style>
  <defs>
    <pattern id="hd-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2F4FE0" stroke-opacity=".16"/>
    </pattern>
    <pattern id="hd-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#2F4FE0" stroke-opacity=".45" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#14171F"/>
  <rect width="1280" height="320" fill="url(#hd-grid)"/>
  <polygon points="1010,0 1280,0 1280,320 890,320" fill="url(#hd-hatch)"/>
  <polygon points="1010,0 1022,0 902,320 890,320" fill="#2F4FE0" fill-opacity=".55"/>

  <g fill="none" stroke="#F6F5F1" stroke-opacity=".45" stroke-width="1.5">
    <path d="M24 44V24H44"/><path d="M1236 24H1256V44"/><path d="M24 276V296H44"/><path d="M1256 276V296H1236"/>
  </g>

  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M640 92H760L820 152H900" stroke="#2F4FE0" stroke-width="6"/>
    <path d="M640 228H740L800 168H860L876 152H900" stroke="#F6F5F1" stroke-width="6" stroke-dasharray="14 8"/>
  </g>
  <rect x="896" y="144" width="16" height="16" fill="#F6F5F1"/>
  <rect x="886" y="134" width="36" height="36" fill="none" stroke="#F6F5F1" stroke-opacity=".5"/>

  <text class="mono" x="640" y="80" font-size="11" fill="#9FB0F5" letter-spacing="1.5">PLAN</text>
  <text class="mono" x="640" y="250" font-size="11" fill="#F6F5F1" fill-opacity=".7" letter-spacing="1.5">REALITY</text>
  <text class="mono" x="930" y="200" font-size="11" fill="#F6F5F1" fill-opacity=".75" letter-spacing="1">19.0760 N · 72.8777 E</text>

  <text class="mono" x="64" y="86" font-size="13" fill="#9FB0F5" letter-spacing="2.5">FF / CRAFTVERSE 2.0</text>
  <text class="sans" x="62" y="160" font-size="68" font-weight="700" fill="#F6F5F1" letter-spacing="-1">FleetFusion</text>
  <text class="sans" x="64" y="198" font-size="20" fill="#F6F5F1" fill-opacity=".72">Real-time delay decisions for road freight.</text>

  <line x1="64" y1="232" x2="560" y2="232" stroke="#F6F5F1" stroke-opacity=".18"/>
  <g stroke="#F6F5F1" stroke-opacity=".35">
    <line x1="64" y1="228" x2="64" y2="236"/><line x1="188" y1="228" x2="188" y2="236"/><line x1="312" y1="228" x2="312" y2="236"/>
    <line x1="436" y1="228" x2="436" y2="236"/><line x1="560" y1="228" x2="560" y2="236"/>
  </g>
  <text class="mono" x="64" y="262" font-size="12" fill="#F6F5F1" fill-opacity=".6" letter-spacing="2">DETECT  ›  DIAGNOSE  ›  PRICE  ›  DECIDE  ›  ACT</text>
</svg>
