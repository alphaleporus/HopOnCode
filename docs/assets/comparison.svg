<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FleetFusion vs existing logistics platforms</title>
  <desc>Tracking data feeds both fleet platforms, which answer where the truck is and when it arrives, and FleetFusion, which prices the stop and recommends the cheapest recovery. Example: Truck #42, 2h 47m disruption, option A wait, option B relief truck, recommended option B.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A91A5"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F4FE0"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="539" rx="16" fill="#F7F8FC" stroke="#E3E6F0"/>

  <text x="40" y="54" font-size="24" font-weight="700" fill="#14171F">They run the network. FleetFusion prices the stop.</text>
  <text x="40" y="80" font-size="14" fill="#5B6275">A financial decision layer on top of the tracking data you already have.</text>

  <!-- Tracking data -->
  <rect x="40" y="112" width="210" height="184" rx="12" fill="#FFFFFF" stroke="#D5DAE8"/>
  <text x="60" y="146" font-size="11" font-weight="600" letter-spacing="1.5" fill="#5B6275">TRACKING DATA</text>
  <text x="60" y="186" font-size="17" font-weight="700" fill="#14171F">GPS trackers</text>
  <text x="60" y="210" font-size="13" fill="#5B6275">Traccar · HTTP feeds</text>
  <text x="60" y="262" font-size="12.5" font-weight="600" fill="#2F4FE0">Stays as it is</text>

  <path d="M250 154H324" stroke="#8A91A5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M250 254H324" stroke="#2F4FE0" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

  <!-- Fleet platforms -->
  <rect x="330" y="112" width="320" height="84" rx="12" fill="#FFFFFF" stroke="#D5DAE8"/>
  <text x="350" y="138" font-size="11" font-weight="600" letter-spacing="1.5" fill="#5B6275">FLEET PLATFORMS / TMS</text>
  <text x="350" y="164" font-size="16" font-weight="700" fill="#14171F">Run the network</text>
  <text x="350" y="184" font-size="12.5" fill="#5B6275">ETAs · alerts · exception workflows</text>

  <!-- FleetFusion -->
  <rect x="330" y="212" width="320" height="84" rx="12" fill="#2F4FE0"/>
  <text x="350" y="238" font-size="11" font-weight="600" letter-spacing="1.5" fill="#C9D3FF">FLEETFUSION</text>
  <text x="350" y="264" font-size="16" font-weight="700" fill="#FFFFFF">Prices the stop</text>
  <text x="350" y="284" font-size="12.5" fill="#E4E9FF">₹ exposure · contracts · recovery options</text>

  <path d="M650 154H694" stroke="#8A91A5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M650 254H694" stroke="#2F4FE0" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

  <!-- Answers -->
  <rect x="700" y="112" width="260" height="84" rx="12" fill="#FFFFFF" stroke="#D5DAE8"/>
  <text x="720" y="138" font-size="11" font-weight="600" letter-spacing="1.5" fill="#5B6275">ANSWERS</text>
  <text x="720" y="164" font-size="14" font-weight="600" fill="#14171F">Where is the vehicle?</text>
  <text x="720" y="184" font-size="14" font-weight="600" fill="#14171F">When will it arrive?</text>

  <rect x="700" y="212" width="260" height="84" rx="12" fill="#EEF1FF" stroke="#2F4FE0" stroke-width="1.5"/>
  <text x="720" y="238" font-size="11" font-weight="600" letter-spacing="1.5" fill="#2F4FE0">ANSWERS</text>
  <text x="720" y="264" font-size="14" font-weight="600" fill="#14171F">What does this stop cost?</text>
  <text x="720" y="284" font-size="14" font-weight="600" fill="#14171F">What is the cheapest fix?</text>

  <line x1="40" y1="324" x2="960" y2="324" stroke="#E3E6F0"/>
  <text x="40" y="356" font-size="11" font-weight="600" letter-spacing="1.5" fill="#2F4FE0">ONE STOP, PRICED</text>

  <!-- Truck -->
  <rect x="40" y="380" width="150" height="100" rx="12" fill="#FFFFFF" stroke="#D5DAE8"/>
  <text x="58" y="414" font-size="16" font-weight="700" fill="#14171F">Truck #42</text>
  <text x="58" y="438" font-size="13" fill="#5B6275">Stopped</text>
  <text x="58" y="458" font-size="11.5" fill="#5B6275">Seen via tracker</text>

  <path d="M190 430H218" stroke="#8A91A5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <!-- Disruption -->
  <rect x="222" y="380" width="170" height="100" rx="12" fill="#FFFFFF" stroke="#D5DAE8"/>
  <text x="240" y="422" font-size="22" font-weight="700" fill="#14171F">2h 47m</text>
  <text x="240" y="444" font-size="13" fill="#5B6275">disruption</text>
  <text x="240" y="466" font-size="14" font-weight="700" fill="#2F4FE0">₹X exposure</text>

  <!-- Branch -->
  <path d="M392 430H408V403H420" stroke="#8A91A5" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M408 430V457H420" stroke="#2F4FE0" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

  <!-- Options -->
  <rect x="424" y="380" width="270" height="46" rx="10" fill="#FFFFFF" stroke="#D5DAE8"/>
  <text x="442" y="408" font-size="14" font-weight="600" fill="#14171F">Option A · Wait</text>
  <text x="676" y="408" font-size="14" font-weight="700" fill="#5B6275" text-anchor="end">₹Y</text>

  <rect x="424" y="434" width="270" height="46" rx="10" fill="#EEF1FF" stroke="#2F4FE0" stroke-width="1.5"/>
  <text x="442" y="462" font-size="14" font-weight="600" fill="#14171F">Option B · Relief truck</text>
  <text x="676" y="462" font-size="14" font-weight="700" fill="#2F4FE0" text-anchor="end">₹Z</text>

  <path d="M694 457H726" stroke="#2F4FE0" stroke-width="1.5" fill="none" marker-end="url(#b)"/>

  <!-- Recommendation -->
  <rect x="730" y="380" width="230" height="100" rx="12" fill="#2F4FE0"/>
  <text x="750" y="412" font-size="11" font-weight="600" letter-spacing="1.5" fill="#C9D3FF">RECOMMENDED</text>
  <text x="750" y="444" font-size="22" font-weight="700" fill="#FFFFFF">Option B</text>
  <text x="750" y="466" font-size="12.5" fill="#E4E9FF">lowest expected cost</text>

  <text x="40" y="514" font-size="12" fill="#8A91A5">Illustrative example. ₹X, ₹Y and ₹Z are placeholders; real figures come from the trip and contract data.</text>
</svg>
